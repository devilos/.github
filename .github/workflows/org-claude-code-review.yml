name: Claude Code Review

# Org-wide CI. Enforced across every Devilos repo via the "Protect default branch"
# ruleset, so there is deliberately NO copy of this file in each repo.
# Adapted from the original uw-v4 workflow, which stays in that repo's history.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: org-claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    # write on pull-requests/issues is what lets the review actually be posted. With read
    # the job still runs the full review, then silently discards it — which is how this sat
    # for months on uw-v4 reporting nothing on any PR.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # This workflow is a MERGE GATE for the whole org, so it must never hard-fail
      # merely because a repo can't see the token. CLAUDE_CODE_OAUTH_TOKEN has to be
      # an ORG secret (it originally lived only on uw-v4); until it is, skip with a
      # warning instead of blocking every PR in every repo.
      - name: Check for review token
        id: guard
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_TOKEN:-}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not available to ${{ github.repository }} — skipping review. Add it as an organization secret to enable this."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.guard.outputs.enabled == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
